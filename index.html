<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>63 部教育動畫連結總覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#234B3F;        /* 黑板墨綠 */
    --board-deep:#18352C;
    --chalk:#F4EFE4;        /* 粉筆白 */
    --paper:#F7F5EF;        /* 紙張底色 */
    --ink:#26302B;
    --tag-class:#2D5DA1;    /* 班級經營：靛藍 */
    --tag-parent:#A34E63;   /* 親職教育：梅紅 */
    --tag-other:#6E6A5E;    /* 其他：暖灰 */
    --line:#DDD6C6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans TC",sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
  }
  a{color:inherit}

  /* ── 黑板式頁首 ── */
  header{
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.06), transparent 55%),
      linear-gradient(160deg, var(--board), var(--board-deep));
    color:var(--chalk);
    padding:56px 24px 44px;
    border-bottom:10px solid #B98A4E; /* 木質板框 */
  }
  .head-inner{max-width:1080px;margin:0 auto}
  .eyebrow{
    font-size:.85rem;letter-spacing:.35em;opacity:.75;
    text-transform:uppercase;margin-bottom:14px;
  }
  h1{
    font-family:"Noto Serif TC",serif;font-weight:900;
    font-size:clamp(1.8rem,4.5vw,3rem);
    letter-spacing:.06em;
  }
  h1 .num{
    display:inline-block;
    border-bottom:4px dashed rgba(244,239,228,.5);
    padding:0 .1em .05em;
  }
  .head-sub{margin-top:12px;font-size:.98rem;opacity:.85;max-width:640px}

  /* ── 工具列 ── */
  .toolbar{
    max-width:1080px;margin:-26px auto 0;padding:0 24px;
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  }
  .search{
    flex:1 1 260px;
    background:#fff;border:1.5px solid var(--line);border-radius:10px;
    padding:12px 16px;font-size:1rem;font-family:inherit;
    box-shadow:0 4px 14px rgba(35,75,63,.10);
  }
  .search:focus{outline:3px solid rgba(45,93,161,.35);border-color:var(--tag-class)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    border:1.5px solid var(--line);background:#fff;border-radius:999px;
    padding:8px 16px;font-size:.9rem;font-family:inherit;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip:hover{border-color:var(--board)}
  .chip:focus-visible{outline:3px solid rgba(45,93,161,.4)}
  .chip.on{background:var(--board);color:var(--chalk);border-color:var(--board)}

  .count{
    max-width:1080px;margin:18px auto 0;padding:0 24px;
    font-size:.88rem;color:#6E6A5E;
  }

  /* ── 卡片清單 ── */
  main{max-width:1080px;margin:14px auto 60px;padding:0 24px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;
    transition:transform .15s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(35,75,63,.12)}
  .card-top{display:flex;align-items:baseline;gap:10px}
  .no{
    font-family:"Noto Serif TC",serif;font-weight:700;
    font-size:1.05rem;color:var(--board);
    min-width:2.2em;
  }
  .title{
    font-weight:700;font-size:1.02rem;line-height:1.45;
  }
  .note{font-size:.85rem;color:#6E6A5E}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .tag{
    font-size:.75rem;color:#fff;border-radius:6px;padding:2px 8px;letter-spacing:.02em;
  }
  .tag.c{background:var(--tag-class)}
  .tag.p{background:var(--tag-parent)}
  .tag.o{background:var(--tag-other)}
  .watch{
    margin-top:4px;align-self:flex-start;
    display:inline-flex;align-items:center;gap:6px;
    text-decoration:none;font-weight:700;font-size:.9rem;
    color:var(--board);border-bottom:2px solid rgba(35,75,63,.35);
    padding-bottom:1px;
  }
  .watch:hover{color:var(--tag-class);border-color:var(--tag-class)}
  .watch:focus-visible{outline:3px solid rgba(45,93,161,.4);border-radius:4px}
  .watch svg{width:16px;height:16px;fill:#C4302B}

  .empty{
    grid-column:1/-1;text-align:center;color:#6E6A5E;
    padding:60px 0;font-size:.95rem;
  }

  footer{
    text-align:center;font-size:.82rem;color:#8B867A;
    padding:0 24px 40px;
  }
  @media (prefers-reduced-motion: reduce){
    .card, .chip{transition:none}
    .card:hover{transform:none}
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="eyebrow">師資培育・案例動畫資源</div>
    <h1><span class="num">63</span> 部教育動畫連結總覽</h1>
    <p class="head-sub">涵蓋班級經營、親職教育與親師合作等主題之案例動畫，點選「觀看影片」即可另開 YouTube 觀賞。可用關鍵字搜尋或依主題篩選。</p>
  </div>
</header>

<div class="toolbar">
  <input class="search" id="q" type="search" placeholder="搜尋片名或關鍵字，例如：霸凌、聯絡簿、師生關係…" aria-label="搜尋動畫">
  <div class="chips" role="group" aria-label="主題篩選">
    <button class="chip on" data-cat="all">全部</button>
    <button class="chip" data-cat="c">班級經營</button>
    <button class="chip" data-cat="p">親職教育與親師合作</button>
    <button class="chip" data-cat="o">其他主題</button>
  </div>
</div>

<p class="count" id="count"></p>

<main id="list" aria-live="polite"></main>

<footer>影片皆連結至 YouTube 原始頁面．適用於師資培育課程之案例討論與親師溝通演練</footer>

const CAT_NAME={c:"班級經營",p:"親職教育與親師合作",o:"其他主題"};
const list=document.getElementById("list");
const countEl=document.getElementById("count");
const q=document.getElementById("q");
let cat="all";

function render(){
  const kw=q.value.trim().toLowerCase();
  const items=DATA.filter(d=>{
    const okCat = cat==="all" || d.c.includes(cat);
    const text=(d.t+d.note).toLowerCase();
    const okKw = !kw || text.includes(kw);
    return okCat && okKw;
  });
  countEl.textContent=`顯示 ${items.length} / ${DATA.length} 部`;
  if(!items.length){
    list.innerHTML=`<div class="empty">找不到符合的動畫，請改用其他關鍵字或切換主題。</div>`;
    return;
  }
  list.innerHTML=items.map(d=>`
    <article class="card">
      <div class="card-top">
        <span class="no">${String(d.n).padStart(2,"0")}</span>
        <span class="title">${d.t}</span>
      </div>
      ${d.note?`<div class="note">${d.note}</div>`:""}
      <div class="tags">${d.c.map(x=>`<span class="tag ${x}">${CAT_NAME[x]}</span>`).join("")}</div>
      <a class="watch" href="${d.u}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4L15.8 12l-6.2 3.6z"/></svg>
        觀看影片
      </a>
    </article>`).join("");
}

q.addEventListener("input",render);
document.querySelectorAll(".chip").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    cat=b.dataset.cat;
    render();
  });
});
render();
</script>
